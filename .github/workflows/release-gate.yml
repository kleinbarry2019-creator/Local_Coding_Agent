---
name: Local Coding Agent Release Gate

on:
  pull_request:
    branches:
      - main
      - "v50-development-*"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.5

      - name: Install locked development dependencies
        run: uv sync --frozen --group dev

      - name: Install shell quality tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap shellcheck shfmt

      - name: Run canonical release gate
        run: ./tools/release_check.sh
